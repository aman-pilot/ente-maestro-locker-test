[package]
name = "locker-seed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ente-accounts = { git = "https://github.com/ente-io/ente.git", rev = "390eb68100b4cdc1a2a74e43e8c94a77ce17bc1e" }
ente-core = { git = "https://github.com/ente-io/ente.git", rev = "390eb68100b4cdc1a2a74e43e8c94a77ce17bc1e", features = ["srp"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.41", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1.8"
