name: "Locker single-account proof"

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: locker-single-account-proof-${{ github.ref }}
    cancel-in-progress: true

jobs:
    proof:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CARGO_TERM_COLOR: always
            LOCKER_SEED_BIN: ${{ github.workspace }}/tools/locker-seed/target/release/locker-seed
            TMPDIR: ${{ runner.temp }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate static contracts
              run: scripts/check-static.sh

            - name: Build pinned Locker seeder
              run: cargo build --release --locked --manifest-path tools/locker-seed/Cargo.toml

            - name: Prove one account across four fixture profiles
              run: |
                  scripts/run-locker-single-account-proof.sh \
                      --seeder "$LOCKER_SEED_BIN" \
                      | tee "$RUNNER_TEMP/locker-single-account-proof.log"

            - name: Summarize redacted proof
              if: always()
              run: |
                  {
                      echo "### Locker single-account hosted proof"
                      echo
                      if [[ -f "$RUNNER_TEMP/locker-single-account-proof.log" ]]; then
                          sed -n \
                              -e '/^timing /p' \
                              -e '/^single_account_proof /p' \
                              "$RUNNER_TEMP/locker-single-account-proof.log"
                      else
                          echo "The proof stopped before producing a redacted summary."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
