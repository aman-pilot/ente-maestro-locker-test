name: "Locker validation"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: locker-static-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        name: Validate test repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Locker test repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate Locker test contracts
              run: scripts/check-static.sh
