name: "Locker Android online"
run-name: "Locker Android online · ${{ inputs.flow || 'all' }}"

on:
    workflow_dispatch:
        inputs:
            flow:
                description: Run the full ordered lane or one registered flow
                required: true
                default: all
                type: string
    pull_request:
        paths:
            - ".github/workflows/locker-android-online.yml"
            - "locker/**"
            - "maestro/locker/online/**"
            - "scripts/check-locker-assets.rb"
            - "scripts/check-locker-boundaries.sh"
            - "scripts/check-product-flows.rb"
            - "scripts/check-static.sh"
            - "scripts/check-workflow-security.rb"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/run-locker-seeded-hosted.sh"
            - "scripts/run-locker-seeded-suite.sh"
            - "scripts/select-locker-seeded-flow.sh"
            - "scripts/summarize-locker-ui-hierarchy.rb"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-run-locker-seeded-hosted.sh"
            - "scripts/test-run-locker-seeded-suite.sh"
            - "scripts/test-select-locker-seeded-flow.sh"
            - "scripts/test-summarize-locker-ui-hierarchy.sh"
            - "tools/locker-seed/**"
    push:
        branches: [main]
        paths:
            - ".github/workflows/locker-android-online.yml"
            - "locker/**"
            - "maestro/locker/online/**"
            - "scripts/check-locker-assets.rb"
            - "scripts/check-locker-boundaries.sh"
            - "scripts/check-product-flows.rb"
            - "scripts/check-static.sh"
            - "scripts/check-workflow-security.rb"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/run-locker-seeded-hosted.sh"
            - "scripts/run-locker-seeded-suite.sh"
            - "scripts/select-locker-seeded-flow.sh"
            - "scripts/summarize-locker-ui-hierarchy.rb"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-run-locker-seeded-hosted.sh"
            - "scripts/test-run-locker-seeded-suite.sh"
            - "scripts/test-select-locker-seeded-flow.sh"
            - "scripts/test-summarize-locker-ui-hierarchy.sh"
            - "tools/locker-seed/**"

permissions:
    contents: read

concurrency:
    group: locker-android-online-${{ github.ref }}-${{ inputs.flow || 'all' }}
    cancel-in-progress: true

env:
    APP_ID: io.ente.locker.independent
    LOCKER_APK_DIR: ${{ github.workspace }}/artifacts/locker
    MAESTRO_CLI_NO_ANALYTICS: 1
    MAESTRO_VERSION: 2.6.1
    MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
    LOCKER_ANDROID_API: 34
    LOCKER_ANDROID_TARGET: default
    LOCKER_EMULATOR_BUILD: 12414864
    LOCKER_EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-metrics -no-snapshot -noaudio -no-boot-anim -memory 6144

jobs:
    resolve:
        name: Plan online tests
        runs-on: ubuntu-latest
        outputs:
            apk_asset_id: ${{ steps.release.outputs.apk_asset_id }}
            apk_created_at: ${{ steps.release.outputs.apk_created_at }}
            apk_name: ${{ steps.release.outputs.apk_name }}
            apk_sha256: ${{ steps.release.outputs.apk_sha256 }}
            channel: ${{ steps.release.outputs.channel }}
            release_tag: ${{ steps.release.outputs.release_tag }}
            selected_flow: ${{ steps.scope.outputs.selected_flow }}
            source_repository: ${{ steps.release.outputs.source_repository }}
        steps:
            - name: Checkout Locker test repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Select E2E scope
              id: scope
              env:
                  REQUESTED_FLOW: ${{ inputs.flow || 'all' }}
              run: |
                  selected_flow=$(scripts/select-locker-seeded-flow.sh "$REQUESTED_FLOW")
                  echo "selected_flow=$selected_flow" >> "$GITHUB_OUTPUT"

            - name: Validate Locker test contracts
              run: scripts/check-static.sh

            - name: Resolve published Locker APK
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/resolve-nightly-apk.sh --app locker --github-output "$GITHUB_OUTPUT"

    online:
        name: Run online tests · ${{ needs.resolve.outputs.selected_flow }}
        needs: resolve
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            LOCKER_COMPOSE_PROJECT: ente-locker-seeded-${{ github.run_id }}-${{ github.run_attempt }}
            LOCKER_SELECTED_FLOW: ${{ needs.resolve.outputs.selected_flow }}
            LOCKER_ONLINE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/maestro/online
            LOCKER_SEED_BIN: ${{ github.workspace }}/tools/locker-seed/target/release/locker-seed
        steps:
            - name: Checkout Locker test repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Download published Locker APK
              id: download-apk
              env:
                  APK_ASSET_ID: ${{ needs.resolve.outputs.apk_asset_id }}
                  APK_CREATED_AT: ${{ needs.resolve.outputs.apk_created_at }}
                  APK_NAME: ${{ needs.resolve.outputs.apk_name }}
                  APK_SHA256: ${{ needs.resolve.outputs.apk_sha256 }}
                  GH_TOKEN: ${{ github.token }}
                  LOCKER_CHANNEL: ${{ needs.resolve.outputs.channel }}
                  LOCKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
                  SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
              run: |
                  mkdir -p "$LOCKER_APK_DIR"
                  apk_path="$LOCKER_APK_DIR/$APK_NAME"
                  gh api \
                      -H 'Accept: application/octet-stream' \
                      "repos/$SOURCE_REPOSITORY/releases/assets/$APK_ASSET_ID" > "$apk_path"

                  echo "LOCKER_APK_PATH=$apk_path" >> "$GITHUB_ENV"
                  echo "LOCKER_APK_ASSET_ID=$APK_ASSET_ID" >> "$GITHUB_ENV"
                  echo "LOCKER_APK_CREATED_AT=$APK_CREATED_AT" >> "$GITHUB_ENV"
                  echo "LOCKER_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
                  echo "LOCKER_APK_SHA256=${APK_SHA256#sha256:}" >> "$GITHUB_ENV"
                  echo "LOCKER_CHANNEL=$LOCKER_CHANNEL" >> "$GITHUB_ENV"
                  echo "LOCKER_RELEASE_TAG=$LOCKER_RELEASE_TAG" >> "$GITHUB_ENV"

            - name: Verify published Locker APK
              id: verify-apk
              run: |
                  actual_sha256=$(sha256sum "$LOCKER_APK_PATH" | awk '{print $1}')
                  if [[ "$actual_sha256" != "$LOCKER_APK_SHA256" ]]; then
                      echo "Downloaded Locker APK does not match the resolved release asset" >&2
                      exit 1
                  fi

            - name: Download and verify Maestro CLI
              run: |
                  curl --fail --location --silent --show-error \
                      "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" \
                      --output "$RUNNER_TEMP/maestro.zip"
                  echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check -

            - name: Install Maestro CLI
              run: |
                  mkdir -p "$HOME/.maestro"
                  unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro"
                  maestro_bin="$HOME/.maestro/maestro/bin/maestro"
                  installed_version=$("$maestro_bin" --version)
                  if [[ "$installed_version" != "$MAESTRO_VERSION" ]]; then
                      echo "Expected Maestro $MAESTRO_VERSION, installed $installed_version" >&2
                      exit 1
                  fi
                  echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

            - name: Build pinned fixture seeder
              run: cargo build --release --locked --manifest-path tools/locker-seed/Cargo.toml

            - name: Enable Android emulator acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run online tests on Android
              id: online-tests
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.LOCKER_ANDROID_API }}
                  emulator-build: ${{ env.LOCKER_EMULATOR_BUILD }}
                  target: ${{ env.LOCKER_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 4
                  emulator-options: ${{ env.LOCKER_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: scripts/run-locker-seeded-hosted.sh --apk "$LOCKER_APK_PATH"

            - name: Write online-test summary
              if: always() && steps.online-tests.outcome != 'skipped'
              env:
                  TEST_OUTCOME: ${{ steps.online-tests.outcome }}
              run: |
                  {
                      echo "### Locker Android online: $TEST_OUTCOME"
                      echo
                      echo "- Release: \`$LOCKER_RELEASE_TAG\`"
                      echo "- Channel: \`$LOCKER_CHANNEL\`"
                      echo "- Build: \`$LOCKER_APK_NAME\`"
                      echo "- Asset created: \`$LOCKER_APK_CREATED_AT\`"
                      echo "- Asset ID: \`$LOCKER_APK_ASSET_ID\`"
                      echo "- Locker APK SHA-256: \`$LOCKER_APK_SHA256\`"
                      echo "- Android API: \`$LOCKER_ANDROID_API\` x86_64; emulator build: \`$LOCKER_EMULATOR_BUILD\`"
                      echo "- Maestro: \`$MAESTRO_VERSION\`"
                      echo "- Scope: \`$LOCKER_SELECTED_FLOW\`"
                      echo "- Account contract: one online account, one shared fixture application, no intra-lane backend reset"
                      echo
                      if [[ -f "$LOCKER_ONLINE_OUTPUT_DIR/summary.txt" ]]; then
                          sed 's/^/- `/' "$LOCKER_ONLINE_OUTPUT_DIR/summary.txt" | sed 's/$/`/'
                      else
                          echo "- The runner stopped before producing a public redacted summary."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload redacted online-test results
              if: always() && steps.online-tests.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: locker-online-results
                  path: |
                      artifacts/maestro/online/results/*.xml
                      artifacts/maestro/online/summary.txt
                      artifacts/maestro/online/diagnostics/*-ui.txt
                  if-no-files-found: warn
                  retention-days: 7

            - name: Remove isolated test backend
              if: always()
              run: |
                  if [[ -x "$LOCKER_SEED_BIN" ]]; then
                      LOCKER_COMPOSE_PROJECT="$LOCKER_COMPOSE_PROJECT" \
                          "$LOCKER_SEED_BIN" stack down --endpoint http://127.0.0.1:8080
                  fi

    locker-online-gate:
        name: Require online tests · ${{ needs.resolve.outputs.selected_flow || inputs.flow || 'unresolved' }}
        if: always()
        needs: [resolve, online]
        runs-on: ubuntu-latest
        steps:
            - name: Require successful online tests
              env:
                  RESOLVE_RESULT: ${{ needs.resolve.result }}
                  ONLINE_RESULT: ${{ needs.online.result }}
              run: |
                  status=0
                  if [[ "$RESOLVE_RESULT" != success ]]; then
                      echo "::error::Online-test planning finished with result=$RESOLVE_RESULT"
                      status=1
                  fi
                  if [[ "$ONLINE_RESULT" != success ]]; then
                      echo "::error::Locker Android online finished with result=$ONLINE_RESULT. Inspect the upstream summary and JUnit artifact."
                      status=1
                  fi
                  exit "$status"
