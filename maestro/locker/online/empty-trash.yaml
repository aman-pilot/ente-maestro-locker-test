appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Save to Locker
    timeout: 30000

# The ordered online lane runs this empty-state check before any flow can move
# data to Trash. The same account is reused for the rest of the lane.
- tapOn: Open navigation menu
- tapOn: Trash
- extendedWaitUntil:
    visible: Trash
    timeout: 10000
- extendedWaitUntil:
    visible: Your trash is empty
    timeout: 10000
- assertVisible: Your trash is empty
