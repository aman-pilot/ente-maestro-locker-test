appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000
- runFlow:
    file: subflows/open-navigation-menu.yaml
- runFlow:
    when:
      visible: Search settings
    commands:
      - tapOn: Search settings
- runFlow:
    when:
      notVisible: Search settings
    commands:
      - tapOn:
          point: 93%,14%
- extendedWaitUntil:
    visible: Search settings
    timeout: 10000

# Search a nested setting and verify that selecting it opens its owning page.
- inputText: recovery
- extendedWaitUntil:
    visible: ".*Recovery key.*"
    timeout: 10000
- tapOn: ".*Recovery key.*"
- extendedWaitUntil:
    visible: Change email
    timeout: 10000
- assertVisible: Change password
- assertVisible: Delete account
- back
- back
- back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
