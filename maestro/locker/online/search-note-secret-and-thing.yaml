appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Search the seeded Note fixture. The published RC's info viewer does not have a
# reliable Back contract, so search coverage stays on Home.
- tapOn: Search your documents
- inputText: Passport Renewal Checklist
- extendedWaitUntil:
    visible: Passport Renewal Checklist
    timeout: 10000
- hideKeyboard
- assertVisible: Passport Renewal Checklist
- pressKey: BACK
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Search the stable Thing fixture without entering the broken info-viewer route.
- tapOn: Search your documents
- inputText: Blue Suitcase
- extendedWaitUntil:
    visible: Blue Suitcase
    timeout: 10000
- hideKeyboard
- assertVisible: Blue Suitcase
- pressKey: BACK
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Open the Secret last so its detail semantics remain covered without attempting
# the RC's broken viewer-to-Home navigation. The next scenario cold-starts Home.
- tapOn: Search your documents
- inputText: GitHub Recovery Codes
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
- hideKeyboard
- tapOn:
    text: GitHub Recovery Codes
    index: 1
- extendedWaitUntil:
    visible: ai.secret.life+0531h@example.com
    timeout: 10000
- assertVisible: GitHub Recovery Codes
- assertVisible: show_password
- tapOn: show_password
- extendedWaitUntil:
    visible: hide_password
    timeout: 10000
- assertVisible: hide_password
- tapOn: hide_password
- extendedWaitUntil:
    visible: show_password
    timeout: 10000
- assertNotVisible: hide_password
