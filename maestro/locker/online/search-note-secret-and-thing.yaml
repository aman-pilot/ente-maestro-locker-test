appId: ${APP_ID}
---
- launchApp
- runFlow:
    when:
      visible: Back
    commands:
      - tapOn: Back
      - runFlow:
          when:
            visible: Discard
          commands:
            - tapOn: Discard
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Search and open the seeded Note fixture.
- tapOn: Search your documents
- inputText: Passport Renewal Checklist
- extendedWaitUntil:
    visible: Passport Renewal Checklist
    timeout: 10000
- tapOn:
    text: done
    optional: true
- tapOn:
    text: Passport Renewal Checklist
    index: 1
- extendedWaitUntil:
    visible: ".*moved updated.*"
    timeout: 10000
- assertVisible: Passport Renewal Checklist
- tapOn: Back

# Reset search state between item types so the search field/result text cannot collide.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Search and open the stable Secret lifecycle item.
- tapOn: Search your documents
- inputText: GitHub Recovery Codes
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
- tapOn:
    text: done
    optional: true
- tapOn:
    text: GitHub Recovery Codes
    index: 1
- extendedWaitUntil:
    visible: ai.secret.life+0531h@example.com
    timeout: 10000
- assertVisible: GitHub Recovery Codes
- assertVisible: show_password
- tapOn: show_password
- extendedWaitUntil:
    visible: hide_password
    timeout: 10000
- assertVisible: hide_password
- tapOn: hide_password
- extendedWaitUntil:
    visible: show_password
    timeout: 10000
- assertNotVisible: hide_password
- tapOn: Back

# Reset search state before the Thing query.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000

# Search and open the stable Thing lifecycle item.
- tapOn: Search your documents
- inputText: Blue Suitcase
- extendedWaitUntil:
    visible: Blue Suitcase
    timeout: 10000
- tapOn:
    text: done
    optional: true
- tapOn:
    text: Blue Suitcase
    index: 1
- extendedWaitUntil:
    visible: ".*moved updated.*"
    timeout: 10000
- assertVisible: Blue Suitcase
- tapOn: Back

- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000
