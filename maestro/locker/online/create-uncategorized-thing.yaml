appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
- assertVisible: Search your documents
- tapOn: Add item
- extendedWaitUntil:
    visible: |-
      Thing
      Save locations of real-world items.
    timeout: 10000
- tapOn: |-
    Thing
    Save locations of real-world items.
- extendedWaitUntil:
    visible: Name of the real-world item
    timeout: 10000
- inputText: Safe Deposit Key
- scrollUntilVisible:
    element: Where is this item kept?
    direction: DOWN
    timeout: 10000
- tapOn: Where is this item kept?
- inputText: Blue folder / Shelf A
- scrollUntilVisible:
    element: Additional information about the item
    direction: DOWN
    timeout: 10000
- tapOn: Additional information about the item
- inputText: "Warranty card + backup key !@#"
- hideKeyboard
- scrollUntilVisible:
    element: "Archive\nArchive"
    direction: DOWN
    timeout: 15000
- tapOn: "Archive\nArchive"
- assertVisible:
    text: "Archive\nArchive"
    selected: true
- tapOn:
    text: "Archive\nArchive"
    selected: true
- extendedWaitUntil:
    visible: Save
    timeout: 15000

# Save without choosing a collection. Locker should create/use Uncategorized
# instead of keeping the editor open.
- tapOn: Save
- extendedWaitUntil:
    visible: Safe Deposit Key
    timeout: 20000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Uncategorized\n[2-9][0-9]* items"
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Uncategorized\n[2-9][0-9]* items"
    point: 25%,50%
- extendedWaitUntil:
    visible: Safe Deposit Key
    timeout: 10000
- tapOn: Safe Deposit Key
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: Blue folder / Shelf A
- assertVisible: "Warranty card + backup key !@#"
