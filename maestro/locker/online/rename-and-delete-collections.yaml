appId: ${APP_ID}
---
# Seeded start state: Account Recovery is empty; Outdoor Gear contains Camping Tent.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Add item
    timeout: 30000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000

# Exercise rename and delete against the seeded empty collection.
- scrollUntilVisible:
    element: "Account Recovery\\n.*items"
    direction: UP
    timeout: 10000
- longPressOn: "Account Recovery\\n.*items"
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- tapOn: Edit
- extendedWaitUntil:
    visible: Rename collection
    timeout: 10000
- eraseText
- inputText: Archived Receipts
- tapOn: Save
- extendedWaitUntil:
    visible: "Archived Receipts\\n.*items"
    timeout: 15000
- longPressOn: "Archived Receipts\\n.*items"
- extendedWaitUntil:
    visible: Delete
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: Collection deleted successfully
    timeout: 20000
- assertNotVisible: "Archived Receipts\\n.*items"

# A non-empty seeded collection must show the destructive choice; cancel it.
- scrollUntilVisible:
    element: "Outdoor Gear\\n.*items"
    direction: DOWN
    timeout: 10000
- longPressOn: "Outdoor Gear\\n.*items"
- extendedWaitUntil:
    visible: Delete
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: Are you sure?
    timeout: 10000
- assertVisible: Also delete items from everywhere
- assertVisible: Yes, delete collection
- back
- extendedWaitUntil:
    visible: "Outdoor Gear\\n.*items"
    timeout: 10000
- assertVisible: "Outdoor Gear\\n.*items"
