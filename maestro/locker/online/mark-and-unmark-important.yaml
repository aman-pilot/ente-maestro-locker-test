appId: ${APP_ID}
---
# Seeded start state: Fireproof Document Box is not Important.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Filters
    timeout: 30000
# Earlier same-account flows add items, so scope Home to the stable seeded
# collection instead of depending on the global Home order or viewport.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: |-
    Home Inventory
    Home Inventory
- back
- extendedWaitUntil:
    visible: Fireproof Document Box
    timeout: 30000
- longPressOn: Fireproof Document Box
- extendedWaitUntil:
    visible: Important
    timeout: 10000
- tapOn: Important
- extendedWaitUntil:
    notVisible: Select all
    timeout: 10000

# Reload before reading Important membership so the assertion and follow-up
# action depend on persisted state rather than the mutation transition frame.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Filters
    timeout: 30000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Important\n.*items"
    timeout: 10000
- tapOn: "Important\n.*items"
- extendedWaitUntil:
    visible: Fireproof Document Box
    timeout: 20000

# Toggle back from the durable Important collection view.
- longPressOn: Fireproof Document Box
- extendedWaitUntil:
    visible: Unimportant
    timeout: 10000
- tapOn: Unimportant
- extendedWaitUntil:
    notVisible: Select all
    timeout: 10000
- extendedWaitUntil:
    notVisible: Fireproof Document Box
    timeout: 20000

# Return to unfiltered Home for the next same-account flow.
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- runFlow:
    when:
      visible: All collections
    commands:
      - tapOn:
          text: Clear all
          optional: true
      - back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
