appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
- assertVisible: Search your documents

# Create a fresh deterministic lifecycle item to avoid existing duplicate Thing rows.
- tapOn: Add item
- extendedWaitUntil:
    visible: |-
      Thing
      Save locations of real-world items.
    timeout: 10000
- tapOn: |-
    Thing
    Save locations of real-world items.
- extendedWaitUntil:
    visible: Name of the real-world item
    timeout: 10000
- inputText: Travel Suitcase
- scrollUntilVisible:
    element: Where is this item kept?
    direction: DOWN
    timeout: 10000
- tapOn: Where is this item kept?
- inputText: Blue folder / Shelf A
- scrollUntilVisible:
    element: Additional information about the item
    direction: DOWN
    timeout: 10000
- tapOn: Additional information about the item
- inputText: "Warranty card + backup key !@#"
- hideKeyboard
# Archive and Moving Plans are seeded online fixture collections.
- scrollUntilVisible:
    element: "Archive\nArchive"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Archive\nArchive"
- assertVisible:
    text: "Archive\nArchive"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: Travel Suitcase
    timeout: 20000
- tapOn: Travel Suitcase
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: Blue folder / Shelf A

# Rename, update notes, and move from Archive to Moving Plans.
- tapOn: Edit
- extendedWaitUntil:
    visible: Save
    timeout: 10000
- eraseText
- inputText: Travel Suitcase Updated
- pressKey: Enter
- eraseText
- inputText: Blue folder / Shelf A moved updated
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "Archive\nArchive"
      selected: true
    timeout: 10000
- tapOn:
    text: "Moving Plans\nMoving Plans"
    selected: false
- assertVisible:
    text: "Moving Plans\nMoving Plans"
    selected: true
- tapOn:
    text: "Archive\nArchive"
    selected: true
- assertVisible:
    text: "Archive\nArchive"
    selected: false
- tapOn: Save
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: Travel Suitcase Updated
- assertVisible: ".*moved updated.*"
- tapOn: Back
- extendedWaitUntil:
    visible: Travel Suitcase Updated
    timeout: 10000

# Delete the renamed Thing to trash.
- longPressOn: Travel Suitcase Updated
- extendedWaitUntil:
    visible: Delete
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: Yes, delete item
    timeout: 10000
- tapOn: Yes, delete item
- extendedWaitUntil:
    visible: Item deleted successfully
    timeout: 10000
- assertNotVisible: Travel Suitcase Updated

# Open Trash, verify the item is view-only, and restore it to Home Inventory.
- tapOn: Open navigation menu
- tapOn: Trash
- extendedWaitUntil:
    visible: Travel Suitcase Updated
    timeout: 10000
- tapOn: Travel Suitcase Updated
- extendedWaitUntil:
    visible: ".*moved updated.*"
    timeout: 10000
- assertNotVisible: Edit
- tapOn: Back
- extendedWaitUntil:
    visible: Travel Suitcase Updated
    timeout: 10000
- longPressOn: Travel Suitcase Updated
- extendedWaitUntil:
    visible: Restore
    timeout: 10000
- tapOn: Restore
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- tapOn:
    text: "Home Inventory\nHome Inventory"
    selected: false
- assertVisible:
    text: "Home Inventory\nHome Inventory"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: 1 item restored successfully
    timeout: 20000
- tapOn: Back
- extendedWaitUntil:
    visible: General
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Travel Suitcase Updated
    timeout: 10000
# Prove the restored item belongs to the selected destination collection.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Home Inventory\\n.*items"
- extendedWaitUntil:
    visible: Travel Suitcase Updated
    timeout: 10000
- tapOn: Travel Suitcase Updated
- extendedWaitUntil:
    visible: ".*moved updated.*"
    timeout: 10000
- assertVisible: ".*moved updated.*"
