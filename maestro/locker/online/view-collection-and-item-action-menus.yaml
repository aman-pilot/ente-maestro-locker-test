appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Add item
    timeout: 10000

# Seeded start state: Home Inventory contains Blue Suitcase. Enter Collections
# through the drawer, the same published-build route proven by empty-collection,
# then open the collection popup menu without selecting actions.
- runFlow:
    file: subflows/open-navigation-menu.yaml
- tapOn: Collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Home Inventory\n.*items"
- tapOn: "Home Inventory\n.*items"
- extendedWaitUntil:
    visible: Blue Suitcase
    timeout: 10000
- runFlow:
    when:
      visible: Show menu
    commands:
      - tapOn: Show menu
- runFlow:
    when:
      notVisible: Edit
    commands:
      - tapOn:
          point: 93%,14%
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: Delete
- back
- extendedWaitUntil:
    visible: Blue Suitcase
    timeout: 10000

# Verify the item selection action surface without mutating the selected item.
- scrollUntilVisible:
    element: Blue Suitcase
- longPressOn: Blue Suitcase
- extendedWaitUntil:
    visible: |-
      1 selected
      close
    timeout: 10000
- assertVisible: Important
- assertVisible: Delete
- assertVisible: Edit
- assertVisible: Share
- assertVisible: Add to
- assertVisible: Download
- tapOn:
    text: ".*selected.*"
- extendedWaitUntil:
    notVisible: Select all
    timeout: 10000

# Return home.
- back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- back
- back
- extendedWaitUntil:
    visible: Add item
    timeout: 10000
- assertVisible: Search your documents
