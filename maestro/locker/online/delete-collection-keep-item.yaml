appId: ${APP_ID}
---
# Seeded start state: Office Equipment contains Spare Monitor.
- stopApp
- launchApp
- extendedWaitUntil:
    # Earlier flows can change the limited Home/recent-items viewport. Enter
    # the seeded collection below before asserting the item itself.
    visible: Search your documents
    timeout: 30000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Office Equipment\\n.*items"
    direction: DOWN
    timeout: 10000
- tapOn: "Office Equipment\\n.*items"
- extendedWaitUntil:
    visible: Spare Monitor
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000

# Delete only the seeded collection, retaining the seeded file.
- scrollUntilVisible:
    element: "Office Equipment\\n.*items"
    direction: DOWN
    timeout: 10000
- longPressOn: "Office Equipment\\n.*items"
- extendedWaitUntil:
    visible: Delete
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: Are you sure?
    timeout: 10000
- assertVisible: Also delete items from everywhere
- assertVisible: Yes, delete collection
- tapOn: Yes, delete collection
- extendedWaitUntil:
    visible: Collection deleted successfully
    timeout: 20000
- assertNotVisible: "Office Equipment\\n.*items"

# The item must remain on the single online account after deleting only its
# collection. Verify it in Uncategorized instead of assuming it is still in
# the limited Home/recent-items viewport after earlier flows mutate recency.
- scrollUntilVisible:
    element: "Uncategorized\\n.*items"
    direction: DOWN
    timeout: 10000
- tapOn: "Uncategorized\\n.*items"
- extendedWaitUntil:
    visible: Spare Monitor
    timeout: 10000
