appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000

# Open the Locker settings surface from home.
- runFlow:
    file: subflows/open-navigation-menu.yaml
- extendedWaitUntil:
    visible: General
    timeout: 10000
- assertVisible: Security
- scrollUntilVisible:
    element: Logout
- assertVisible: Logout

# About is a safe settings page; verify static/link rows without opening them.
- scrollUntilVisible:
    element: About
    direction: UP
- tapOn: About
- extendedWaitUntil:
    visible: About
    timeout: 10000
- assertVisible: We are open source!
- assertVisible: Blog
- assertVisible: Privacy
- assertVisible: Terms
- tapOn: Back
- extendedWaitUntil:
    visible: Logout
    timeout: 10000
- scrollUntilVisible:
    # The published RC uses "Help & Support" while newer Locker builds use
    # "Help and Support". Keep the product flow valid for both labels.
    element: "Help (&|and) Support"
    direction: UP

# Help and Support is safe to visit as long as external actions are not tapped.
- tapOn: "Help (&|and) Support"
- extendedWaitUntil:
    visible: "Help (&|and) Support"
    timeout: 10000
- assertVisible: Ask a question
- assertVisible: Request a feature
- assertVisible: Report an issue
- scrollUntilVisible:
    element: Browse help pages
    direction: DOWN
    timeout: 10000
- assertVisible: Browse help pages
- tapOn: Back
- extendedWaitUntil:
    visible: General
    timeout: 10000

# Return to home.
- tapOn: Back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
- assertVisible: Search your documents
