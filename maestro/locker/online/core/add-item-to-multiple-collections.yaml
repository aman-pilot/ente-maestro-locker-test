appId: ${APP_ID}
---
# Seeded start state: Moving Dolly belongs only to Moving Plans; Home Projects is empty.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Moving Dolly
    timeout: 30000
- longPressOn: Moving Dolly
- extendedWaitUntil:
    visible: Add to
    timeout: 10000
- tapOn: Add to
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- scrollUntilVisible:
    element: "Home Projects\\n.*"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    text: "Home Projects\\n.*"
    selected: false
- assertVisible:
    text: "Home Projects\\n.*"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: Filters
    timeout: 20000

# Verify the item remains in Moving Plans and is now also in Home Projects.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Moving Plans\\n.*items"
- extendedWaitUntil:
    visible: Moving Dolly
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Home Projects\\n.*items"
- extendedWaitUntil:
    visible: Moving Dolly
    timeout: 10000
- assertVisible: Moving Dolly
