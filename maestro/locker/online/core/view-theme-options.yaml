appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Save to Locker
    timeout: 10000

# Open Settings > Appearance/Theme and assert the safe theme choices.
# This smoke is view-only so it never leaves the app in a changed theme.
- tapOn: Open navigation menu
- extendedWaitUntil:
    visible: General
    timeout: 10000
- assertVisible: Security
- assertVisible: Appearance
- tapOn: Appearance
- extendedWaitUntil:
    visible: Theme
    timeout: 10000
- assertVisible: System
- assertVisible: Light
- assertVisible: Dark

# Return home without changing the selected theme.
- tapOn: Back
- extendedWaitUntil:
    visible: General
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Save to Locker
    timeout: 10000
- assertVisible: Save to Locker
