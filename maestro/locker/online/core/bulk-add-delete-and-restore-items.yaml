appId: ${APP_ID}
---
# Seeded start state: Camping Stove and Sleeping Bag are in Camping Gear;
# Weekend Trips exists but is empty.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 30000
- assertVisible: Sleeping Bag

# Add both seeded items to the target collection.
- longPressOn: Camping Stove
- extendedWaitUntil:
    visible: |-
      1 selected
      close
    timeout: 10000
- tapOn: Sleeping Bag
- extendedWaitUntil:
    visible: |-
      2 selected
      close
    timeout: 10000
- tapOn: Add to
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- scrollUntilVisible:
    element: "Weekend Trips\nWeekend Trips"
    timeout: 10000
- tapOn:
    text: "Weekend Trips\nWeekend Trips"
    selected: false
- assertVisible:
    text: "Weekend Trips\nWeekend Trips"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: Filters
    timeout: 20000

# Prove both memberships in the target collection.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Weekend Trips\\n.*items"
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 10000
- assertVisible: Sleeping Bag
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 10000

# Exercise bulk delete and restore; the selected target collection is explicit.
- longPressOn: Camping Stove
- tapOn: Sleeping Bag
- extendedWaitUntil:
    visible: |-
      2 selected
      close
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: 2 items will be deleted permanently.
    timeout: 10000
- tapOn: Yes, delete items
- extendedWaitUntil:
    visible: Item deleted successfully
    timeout: 20000
- assertNotVisible: Camping Stove
- assertNotVisible: Sleeping Bag
- tapOn: Open navigation menu
- tapOn: Trash
- extendedWaitUntil:
    visible: Trash
    timeout: 10000
- assertVisible: Camping Stove
- assertVisible: Sleeping Bag
- longPressOn: Camping Stove
- tapOn: Sleeping Bag
- extendedWaitUntil:
    visible: |-
      2 selected
      close
    timeout: 10000
- tapOn: Restore
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- scrollUntilVisible:
    element: "Weekend Trips\nWeekend Trips"
    timeout: 10000
- tapOn:
    text: "Weekend Trips\nWeekend Trips"
    selected: false
- assertVisible:
    text: "Weekend Trips\nWeekend Trips"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: 2 items restored successfully
    timeout: 20000
- tapOn: Back
- extendedWaitUntil:
    visible: General
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 10000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Weekend Trips\\n.*items"
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 10000
- assertVisible: Sleeping Bag
