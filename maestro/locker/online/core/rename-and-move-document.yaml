appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home Insurance Policy\\.pdf"
    timeout: 30000

# Operate on the encrypted document seeded through Museum/MinIO; no native
# file-picker setup is needed for rename and collection-membership coverage.
- longPressOn: "Home Insurance Policy\\.pdf"
- extendedWaitUntil:
    visible: |-
      1 selected
      close
    timeout: 10000
- tapOn: Edit
- extendedWaitUntil:
    visible: Edit item
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: |-
        Insurance Documents
        Insurance Documents
      selected: true
    timeout: 10000
- tapOn: Home Insurance Policy.pdf
- eraseText
- inputText: Home Insurance Renewal.pdf
- hideKeyboard
- scrollUntilVisible:
    element: |-
      Policy Archive
      Policy Archive
    timeout: 10000
- tapOn:
    text: |-
      Policy Archive
      Policy Archive
    selected: false
- assertVisible:
    text: |-
      Policy Archive
      Policy Archive
    selected: true
- tapOn:
    text: |-
      Insurance Documents
      Insurance Documents
    selected: true
- assertVisible:
    text: |-
      Insurance Documents
      Insurance Documents
    selected: false
- tapOn:
    text: Save
    enabled: true
- extendedWaitUntil:
    visible: Item updated successfully!
    timeout: 20000

# Reload the app before reading collection contents so the assertion observes
# the same persisted Museum state that a new CI process would see.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home Insurance Renewal\\.pdf"
    timeout: 15000

# Verify the renamed document in its target collection and after relaunch.
- tapOn: Filters
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Policy Archive\n.*items"
- tapOn: "Policy Archive\n.*items"
- extendedWaitUntil:
    visible: "Home Insurance Renewal\\.pdf"
    timeout: 10000
- tapOn: Back
- tapOn: Back
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 15000
- tapOn: Search your documents
- inputText: Home Insurance Renewal
- extendedWaitUntil:
    visible: "Home Insurance Renewal\\.pdf"
    timeout: 10000
