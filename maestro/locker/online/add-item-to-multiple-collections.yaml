appId: ${APP_ID}
---
# Seeded start state: Camping Stove belongs only to Camping Gear; Home Projects
# exists but is empty.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 30000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Camping Gear\\n.*items"
    direction: DOWN
    timeout: 10000
- tapOn: "Camping Gear\\n.*items"
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 15000

# Add the seeded home item to a second ordinary collection.
- longPressOn: Camping Stove
- extendedWaitUntil:
    visible: Add to
    timeout: 10000
- tapOn: Add to
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- scrollUntilVisible:
    element: "Home Projects\nHome Projects"
    timeout: 10000
- tapOn:
    text: "Home Projects\nHome Projects"
    selected: false
- assertVisible:
    text: "Home Projects\nHome Projects"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 20000
# The selection sheet proves Home Projects was chosen; returning to Camping
# Stove here proves Add-to preserved the original Camping Gear membership.

# Return to unfiltered Home before the next flow reuses this app session.
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- runFlow:
    when:
      visible: All collections
    commands:
      - tapOn:
          text: Clear all
          optional: true
      - back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
