appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: Save to Locker
    timeout: 10000
- assertVisible: Save to Locker
- tapOn: Save to Locker
- extendedWaitUntil:
    visible: |-
      Secret
      Preserve account credentials.
    timeout: 10000
- tapOn: |-
    Secret
    Preserve account credentials.
- extendedWaitUntil:
    visible: Name of the service
    timeout: 10000
- inputText: Banking Recovery Codes
- pressKey: Enter
- inputText: banking.recovery@example.org
- pressKey: Enter
- inputText: P@ssw0rd!#20260530
- pressKey: Enter
- tapOn: Additional notes
- inputText: "Recovery: blue key / Symbols !@#"
- hideKeyboard

# Save without choosing a collection. Locker should create/use Uncategorized
# instead of keeping the editor open.
- tapOn: Save
- extendedWaitUntil:
    visible: Banking Recovery Codes
    timeout: 20000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: "Uncategorized\nUncategorized"
- back
- extendedWaitUntil:
    visible: Banking Recovery Codes
    timeout: 10000
- tapOn: Banking Recovery Codes
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: banking.recovery@example.org
- assertVisible: show_password
- assertNotVisible: P@ssw0rd!#20260530
- tapOn: show_password
- assertVisible: P@ssw0rd!#20260530
- tapOn: hide_password
- assertNotVisible: P@ssw0rd!#20260530
