appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
- assertVisible: Search your documents
- tapOn: Add item
- extendedWaitUntil:
    visible: |-
      Secret
      Preserve account credentials.
    timeout: 10000
- tapOn: |-
    Secret
    Preserve account credentials.
- extendedWaitUntil:
    visible: Name of the service
    timeout: 10000
- inputText: Banking Recovery Codes
- scrollUntilVisible:
    element: Login ID or email
    direction: DOWN
    timeout: 10000
- tapOn: Login ID or email
- inputText: banking.recovery@example.org
- scrollUntilVisible:
    element: Password
    direction: DOWN
    timeout: 10000
- tapOn: Password
- inputText: P@ssw0rd!#20260530
- scrollUntilVisible:
    element: Recovery methods, security questions, ...
    direction: DOWN
    timeout: 10000
- tapOn: Recovery methods, security questions, ...
- inputText: "Recovery: blue key / Symbols !@#"
- hideKeyboard
- scrollUntilVisible:
    element: "Archive\nArchive"
    direction: DOWN
    timeout: 15000
- tapOn: "Archive\nArchive"
- assertVisible:
    text: "Archive\nArchive"
    selected: true
- tapOn:
    text: "Archive\nArchive"
    selected: true
- extendedWaitUntil:
    visible: Save
    timeout: 15000

# Save without choosing a collection. Locker should create/use Uncategorized
# instead of keeping the editor open.
- tapOn: Save
- extendedWaitUntil:
    visible: Banking Recovery Codes
    timeout: 20000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Uncategorized\n[2-9][0-9]* items"
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Uncategorized\n[2-9][0-9]* items"
    point: 25%,50%
- extendedWaitUntil:
    visible: Banking Recovery Codes
    timeout: 10000
- tapOn: Banking Recovery Codes
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: banking.recovery@example.org
- assertVisible: show_password
- assertNotVisible: P@ssw0rd!#20260530
- tapOn: show_password
- assertVisible: P@ssw0rd!#20260530
- tapOn: hide_password
- assertNotVisible: P@ssw0rd!#20260530
