appId: ${APP_ID}
---
- stopApp
- launchApp
# Scope Select all to the shared Camping Gear fixture so other hosted-fixture
# items on the same account cannot change the expected selection count.
- extendedWaitUntil:
    visible: Filters
    timeout: 30000
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: |-
    Camping Gear
    Camping Gear
- back
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 30000
- assertVisible: Sleeping Bag

# Seeded start state: Camping Stove and Sleeping Bag are unimportant. Exercise
# the selection controls independently before changing item state.
- longPressOn: Camping Stove
- extendedWaitUntil:
    visible: |-
      1 selected
      close
    timeout: 10000
- tapOn: Select all
- extendedWaitUntil:
    visible: |-
      2 selected
      close
    timeout: 10000
- tapOn: Deselect all
- extendedWaitUntil:
    notVisible: Select all
    timeout: 10000

# Mark the entire seeded inventory Important in one action.
- longPressOn: Camping Stove
- tapOn: Select all
- extendedWaitUntil:
    visible: |-
      2 selected
      close
    timeout: 10000
- tapOn: Important
- extendedWaitUntil:
    visible: Filters
    timeout: 20000

# The success toast is intentionally not asserted because it is transient.
# Verify both records through their durable Important membership instead.
- tapOn: Filters
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Important\n.*items"
- tapOn: "Important\n.*items"
- extendedWaitUntil:
    visible: Camping Stove
    timeout: 10000
- assertVisible: Sleeping Bag

# Return to unfiltered home for the next flow in the same-account lane.
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- runFlow:
    when:
      visible: All collections
    commands:
      - tapOn: Clear all
      - back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
