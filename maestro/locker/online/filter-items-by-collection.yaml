appId: ${APP_ID}
---
# Seeded start state: Garage Equipment contains Extension Ladder.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Filters
    timeout: 30000

# Apply the seeded collection filter before asserting the item. Earlier flows
# add records, so global Home ordering cannot establish fixture visibility.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- extendedWaitUntil:
    visible: |-
      Garage Equipment
      Garage Equipment
    timeout: 10000
- tapOn: |-
    Garage Equipment
    Garage Equipment
- back
- extendedWaitUntil:
    visible: Extension Ladder
    timeout: 10000
- assertVisible: Add item

# Prove the same seeded membership through the collection page.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- scrollUntilVisible:
    element: "Garage Equipment\\n.*items?"
    direction: UP
    centerElement: true
    timeout: 10000
- tapOn:
    text: "Garage Equipment\\n.*items?"
    point: 25%,50%
- extendedWaitUntil:
    notVisible: "Garage Equipment\\n.*items?"
    timeout: 10000
- assertVisible: Extension Ladder

# Clear the filter; account disposal, not UI cleanup, restores isolation.
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- runFlow:
    when:
      visible: All collections
    commands:
      - tapOn:
          text: Clear all
          optional: true
      - back
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
