appId: ${APP_ID}
---
# Seeded start state: Garage Equipment contains Extension Ladder.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Extension Ladder
    timeout: 30000

# Apply the seeded collection filter from home.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- extendedWaitUntil:
    visible: |-
      Garage Equipment
      Garage Equipment
    timeout: 10000
- tapOn: |-
    Garage Equipment
    Garage Equipment
- back
- extendedWaitUntil:
    visible: Extension Ladder
    timeout: 10000
- assertVisible: Add item

# Prove the same seeded membership through the collection page.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Garage Equipment\\n.*items"
- extendedWaitUntil:
    visible: Garage Equipment
    timeout: 10000
- assertVisible: Extension Ladder

# Clear the filter; account disposal, not UI cleanup, restores isolation.
- tapOn: Back
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: Back
- runFlow:
    when:
      visible: All collections
    commands:
      - tapOn: Clear all
      - back
- extendedWaitUntil:
    visible: Add item
    timeout: 10000
- assertVisible: Search your documents
