appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Search your documents
    timeout: 10000
- assertVisible: Search your documents

# Create a fresh deterministic lifecycle secret.
- tapOn: Add item
- extendedWaitUntil:
    visible: |-
      Secret
      Preserve account credentials.
    timeout: 10000
- tapOn: |-
    Secret
    Preserve account credentials.
- extendedWaitUntil:
    visible: Name of the service
    timeout: 10000
- inputText: GitHub Backup Codes
- scrollUntilVisible:
    element: Login ID or email
    direction: DOWN
    timeout: 10000
- tapOn: Login ID or email
- inputText: recovery.codes@example.org
- scrollUntilVisible:
    element: Password
    direction: DOWN
    timeout: 10000
- tapOn: Password
- inputText: P@ssw0rd!#0531H
- scrollUntilVisible:
    element: Recovery methods, security questions, ...
    direction: DOWN
    timeout: 10000
- tapOn: Recovery methods, security questions, ...
- inputText: "Recovery: lifecycle base !@#"
- hideKeyboard
# Archive and Secure Archive are seeded online fixture collections.
- scrollUntilVisible:
    element: "Archive\nArchive"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Archive\nArchive"
- assertVisible:
    text: "Archive\nArchive"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: GitHub Backup Codes
    timeout: 20000

# Open, verify password show/hide, rename, and move from Archive to Secure Archive.
- tapOn: GitHub Backup Codes
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: recovery.codes@example.org
- assertVisible: show_password
- assertNotVisible: P@ssw0rd!#0531H
- tapOn: show_password
- assertVisible: P@ssw0rd!#0531H
- tapOn: hide_password
- assertNotVisible: P@ssw0rd!#0531H
- tapOn: Edit
- extendedWaitUntil:
    visible: Save
    timeout: 10000
- eraseText
- inputText: GitHub Recovery Codes
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "Archive\nArchive"
      selected: true
    timeout: 10000
- tapOn:
    text: "Secure Archive\nSecure Archive"
    selected: false
- assertVisible:
    text: "Secure Archive\nSecure Archive"
    selected: true
- tapOn:
    text: "Archive\nArchive"
    selected: true
- assertVisible:
    text: "Archive\nArchive"
    selected: false
- tapOn: Save
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- assertVisible: GitHub Recovery Codes
- assertVisible: recovery.codes@example.org
- tapOn: Back
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000

# Delete the secret to Trash.
- longPressOn: GitHub Recovery Codes
- extendedWaitUntil:
    visible: Delete
    timeout: 10000
- tapOn: Delete
- extendedWaitUntil:
    visible: Yes, delete item
    timeout: 10000
- tapOn: Yes, delete item
- extendedWaitUntil:
    visible: Item deleted successfully
    timeout: 10000
- assertNotVisible: GitHub Recovery Codes

# Open Trash, verify view-only, restore to Secure Archive, and verify fields persist.
- runFlow:
    file: subflows/open-navigation-menu.yaml
- tapOn: Trash
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
- tapOn: GitHub Recovery Codes
- extendedWaitUntil:
    visible: recovery.codes@example.org
    timeout: 10000
- assertNotVisible: Edit
- tapOn: Back
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
- longPressOn: GitHub Recovery Codes
- extendedWaitUntil:
    visible: Restore
    timeout: 10000
- tapOn: Restore
- extendedWaitUntil:
    visible: Add to collection
    timeout: 10000
- tapOn:
    text: "Secure Archive\nSecure Archive"
    selected: false
- assertVisible:
    text: "Secure Archive\nSecure Archive"
    selected: true
- tapOn: Save
- extendedWaitUntil:
    visible: 1 item restored successfully
    timeout: 20000
- tapOn: Back
- extendedWaitUntil:
    visible: General
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
# Prove the restored item belongs to the selected destination collection.
- tapOn: Filters
- extendedWaitUntil:
    visible: All collections
    timeout: 10000
- tapOn: All collections
- extendedWaitUntil:
    visible: Collections
    timeout: 10000
- tapOn: "Secure Archive\\n.*items"
- extendedWaitUntil:
    visible: GitHub Recovery Codes
    timeout: 10000
- tapOn: GitHub Recovery Codes
- extendedWaitUntil:
    visible: recovery.codes@example.org
    timeout: 10000
- assertVisible: show_password
- assertNotVisible: P@ssw0rd!#0531H
- tapOn: show_password
- assertVisible: P@ssw0rd!#0531H
- tapOn: hide_password
- assertNotVisible: P@ssw0rd!#0531H
